name: Android APK
on:
  push:
    branches: [main, native-kotlin-migration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Install and harden native Android code
        run: node scripts/install-android-native.mjs
      - name: Build one installable APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Audit single APK
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$apk"
          ls -lh "$apk"
          if unzip -Z1 "$apk" | grep -Eiq '(^|/)(chaquopy|python[0-9.]*|yt.?dlp|ffmpeg)(/|\\.|$)|libpython'; then
            echo "Forbidden Python/yt-dlp/FFmpeg runtime file detected"
            exit 1
          fi
          echo "Single APK audit passed."
      - name: Upload one installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Nice-Downloader-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
