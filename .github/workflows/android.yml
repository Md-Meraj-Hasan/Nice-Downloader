name: Android APK
on:
  push:
    branches: [main, native-kotlin-migration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Install minimal Kotlin downloader
        run: node scripts/install-android-native.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug and optimized release APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease
      - name: Audit APK contents and report sizes
        shell: bash
        run: |
          set -euo pipefail
          for apk in android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release-unsigned.apk; do
            test -f "$apk"
            echo "=== $apk ==="
            ls -lh "$apk"
            du -h "$apk"
            if unzip -Z1 "$apk" | grep -Eiq '(^|/)(chaquopy|python[0-9.]*|yt.?dlp|ffmpeg)(/|\.|$)|libpython'; then
              echo "Forbidden Python/yt-dlp/FFmpeg runtime file detected"
              exit 1
            fi

          done
          echo "Runtime audit passed: no bundled Python, Chaquopy, yt-dlp, or FFmpeg runtime markers."
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Nice-Downloader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: Nice-Downloader-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
